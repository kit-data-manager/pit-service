////////////////////////////////////////////////////////////////////////////////
// Build jar file with all tests executed.
// Before releasing code you should at least once run all the tests.
////////////////////////////////////////////////////////////////////////////////
println "Using complete profile for building '${name}'"

test {
    finalizedBy jacocoTestReport
    environment "spring.config.location", "classpath:/test/"
    // for junit5
    useJUnitPlatform()
    println "Tests will have verbose output"
    testLogging {
        // tests are never "up-to-date", always print everything
        outputs.upToDateWhen {false}
        // show stdio when tests are running
        showStandardStreams = true
        // for junit5
        events "passed", "skipped", "failed"
    }
}

// Generate coverage report
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = false
    }
    afterEvaluate {
        //exclude some classes/package from code coverage report
        classDirectories.setFrom(files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: [\
            '**/SchemaSynchronization*'
                        ])
                }))
    }
}
